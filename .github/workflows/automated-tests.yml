name: PHP Composer

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start pre-installed MySQL
        run: |
          sudo systemctl start mysql
          mysql -u root -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '';"
          mysql -u root -e "CREATE DATABASE IF NOT EXISTS myhmsdb;"
          mysql -u root myhmsdb < myhmsdb.sql
          mysql -u root -e "CREATE DATABASE IF NOT EXISTS myhmsdb_test;"
          mysql -u root myhmsdb_test < myhmsdb.sql
      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite
        run: php vendor/bin/phpunit --testdox