name: PHP Composer

on:
  push:
    branches: [ "master", "josias-DEV" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: myhmsdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up main database
        run: mysql -h 127.0.0.1 -u root myhmsdb < myhmsdb.sql

      - name: Set up test database
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS myhmsdb_test;"
          mysql -h 127.0.0.1 -u root myhmsdb_test < myhmsdb.sql

      - name: Configure PHP to use TCP instead of Unix socket
        run: |
          PHP_INI=$(php --ini | grep "Loaded Configuration" | cut -d: -f2 | xargs)
          echo "mysqli.default_host=127.0.0.1" | sudo tee -a "$PHP_INI"
          echo "mysqli.default_port=3306" | sudo tee -a "$PHP_INI"

      - name: Run test suite
        run: php vendor/bin/phpunit --testdox
